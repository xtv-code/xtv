spring:
  application:
    name: xtv
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  flyway:
    enabled: true

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 2GB
    max-swallow-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

xtv:
  storage-root: data/media
  jobs-enabled: true
  payment-simulate: false
  auto-register: true
  jwt-secret: xtv-dev-jwt-secret-change-me-32b
  cors-origins: ${XTV_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*,http://10.*:*,http://192.168.*:*,http://172.*:*}
  admin:
    username: admin
    password: admin123
  usdt:
    receive-address: ${XTV_USDT_ADDRESS:}
    api-key: ${XTV_TRON_API_KEY:}
    trongrid-base: https://api.trongrid.io
  s3:
    endpoint: ${XTV_S3_ENDPOINT:}
    region: ${XTV_S3_REGION:us-east-1}
    bucket: ${XTV_S3_BUCKET:}
    access-key: ${XTV_S3_ACCESS_KEY:}
    secret-key: ${XTV_S3_SECRET_KEY:}
